site_name: "Manufacturing BI Copilot Documentation"
site_url: "https://manufacturing-bi-copilot-docs.readthedocs.io/"
site_description: "Official documentation for Manufacturing BI Copilot. Learn how to analyze production data, predict machine failures, and identify anomalies using AI-powered analytics."
site_author: "Manufacturing BI Copilot Team"
docs_dir: .

# Stops Read the Docs from crashing during nested compilation loops
exclude_docs: |
  _readthedocs/*
  .readthedocs.yaml

# Advanced SEO Meta Data
extra:
  version: "1.0.0"
  keywords: "manufacturing analytics, predictive maintenance, production anomaly detection, factory BI tool, machine failure forecasting, manufacturing AI assistant"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mayurlohar955-lgtm/manufacturing-bi-copilot-docs

use_directory_urls: true

nav:
  - Home: README.md
  - User Guides:
    - Main Workspace: USER_GUIDE.md
  - Help & Support:
    - Troubleshooting: docs/Troubleshooting.md
    - FAQ: docs/FAQ.md
  - Trust & Compliance:
    - Security Policy: docs/Security.md
    - System Reliability: docs/Reliability.md

# Simplified Theme Setup to prevent line cutoff errors
theme:
  name: material
  features:
    - navigation.tabs
    - search.suggest
  announcement: |
    🚀 <strong>New Update:</strong> Version 1.0 is live! Test the new real-time anomaly features now. 
    <a href="https://bhavu.co" target="_blank" style="color: #FFEB3B; font-weight: bold; text-decoration: underline; margin-left: 10px;">Launch Live App →</a>
