site_name: "Manufacturing BI Copilot Documentation"
site_url: "https://manufacturing-bi-copilot-docs.readthedocs.io/"
site_description: "Official documentation for Manufacturing BI Copilot. Learn how to analyze production data, predict machine failures, and identify anomalies using AI-powered analytics."
site_author: "Manufacturing BI Copilot Team"
docs_dir: .

# FIXED: This line stops Read the Docs from crashing during compilation
exclude_docs: |
  _readthedocs/*
  .readthedocs.yaml

# 1. Advanced SEO Meta Tags
extra:
  version: "1.0.0"
  keywords: "manufacturing analytics, predictive maintenance, production anomaly detection, factory BI tool, machine failure forecasting, manufacturing AI assistant"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com

# 2. Automatically generate a sitemap.xml for Google crawler bots
use_directory_urls: true

nav:
  - Home: README.md
  - User Guides:
    - Main Workspace: USER_GUIDE.md
  - Help & Support:
    - Troubleshooting: docs/Troubleshooting.md
    - FAQ: docs/FAQ.md
  - Trust & Compliance:
    - Security Policy: docs/Security.md
    - System Reliability: docs/Reliability.md

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - search.suggest
